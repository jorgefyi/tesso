name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test

  # Stated minimum. The example pins fusor-build 0.1.7. A newer CLI refuses
  # that pin, so this job installs CLI 0.1.7 itself and builds only the
  # example. The site pins 0.1.9, so it is not built here.
  fusor-0-1-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Install Fusor CLI 0.1.7
        run: |
          curl -fsSL https://fusor.build/install.sh | sh -s -- v0.1.7
          echo "$HOME/.fusor/bin" >> "$GITHUB_PATH"
      - name: Build the example on Fusor 0.1.7
        working-directory: examples/counter-themed
        run: |
          npm install
          fusor install
          fusor build

  # Site pin. Builds the site on fusor-build 0.1.9 with the matching CLI.
  # Job id stays fusor-main for existing required checks. Fusor git main is
  # already 0.1.10 and unpublished on crates.io, so this installs CLI 0.1.9
  # instead of cargo install --git. Deploy uses the same install.sh pin.
  fusor-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Install Fusor CLI 0.1.9
        run: |
          curl -fsSL https://fusor.build/install.sh | sh -s -- v0.1.9
          echo "$HOME/.fusor/bin" >> "$GITHUB_PATH"
      - name: Build the site
        working-directory: site
        run: |
          npm install
          fusor install
          fusor build
          node split-not-found.mjs
