name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test

  # Fusor 0.1.7 via install.sh. 0.1.7 fixes the musl Tailwind download
  # on glibc hosts (fusor-rs/fusor#53).
  fusor-0-1-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Install Fusor CLI 0.1.7
        run: |
          curl -fsSL https://fusor.build/install.sh | sh -s -- v0.1.7
          echo "$HOME/.fusor/bin" >> "$GITHUB_PATH"
      - name: Build the example on Fusor 0.1.7
        working-directory: examples/counter-themed
        run: |
          npm install
          fusor install
          fusor build
      - name: Build the site on Fusor 0.1.7
        working-directory: site
        run: |
          npm install
          fusor install
          fusor build
          node split-not-found.mjs

  # Current Fusor CLI from main, building the same 0.1.7 apps.
  fusor-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Install Fusor CLI from main
        run: cargo install --git https://github.com/fusor-rs/fusor fusor-cli
      - name: Build the example
        working-directory: examples/counter-themed
        run: |
          npm install
          fusor install
          fusor build
      - name: Build the site
        working-directory: site
        run: |
          npm install
          fusor install
          fusor build
          node split-not-found.mjs
