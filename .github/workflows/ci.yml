name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test

  # Stated minimum. The example pins fusor-build 0.1.7. CLI 0.1.9 refuses
  # that pin, so this job installs CLI 0.1.7 itself and builds only the
  # example. The site pins 0.1.9, so it is not built here.
  fusor-0-1-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Install Fusor CLI 0.1.7
        run: |
          curl -fsSL https://fusor.build/install.sh | sh -s -- v0.1.7
          echo "$HOME/.fusor/bin" >> "$GITHUB_PATH"
      - name: Build the example on Fusor 0.1.7
        working-directory: examples/counter-themed
        run: |
          npm install
          fusor install
          fusor build

  # CLI from main, which is the 0.1.9 release. Builds the site (pinned to
  # fusor-build 0.1.9). Does not build the 0.1.7 example. A fusor-0-1-9
  # job would repeat this site build. Deploy installs the same release
  # with install.sh v0.1.9.
  fusor-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - name: Install Fusor CLI from main
        run: cargo install --git https://github.com/fusor-rs/fusor fusor-cli
      - name: Build the site
        working-directory: site
        run: |
          npm install
          fusor install
          fusor build
          node split-not-found.mjs
