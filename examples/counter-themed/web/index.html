<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/tesso.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="icon" href="/favicon.svg" />
    <title>Shift counter</title>
  </head>
  <body>
    <App state="{{ App::new() }}">
      <section class="shell">
        <Card title="Shift" description="A Fusor counter styled with Tesso tokens.">
          <p class="count" aria-live="polite">{{ state.count.get() }}</p>
          <div class="row">
            <Button variant="quiet" size="md" on_press="{{ state.decrement.clone() }}">Minus</Button>
            <Button variant="primary" size="md" on_press="{{ state.increment.clone() }}">Plus</Button>
          </div>
          <ThemeToggle></ThemeToggle>
          <div class="row">
            <Button variant="secondary" size="sm" on_press="{{ state.ask_reset.clone() }}">Reset</Button>
          </div>
          <div class="swatches" aria-hidden="true">
            <div class="swatch danger">Danger <span>destructive</span></div>
            <div class="swatch success">Success <span>success</span></div>
            <div class="swatch warning">Warning <span>warning</span></div>
          </div>
          <p class="warn-copy">Cutoff in 2 hours. This line uses warning-foreground.</p>
          <span class="utility-sample bg-primary text-primary-foreground rounded-md px-2 py-1">bg-primary</span>
          <template slot="footer">
            <p class="meta">Stored in this tab.</p>
          </template>
        </Card>
        <Dialog
          open="{{ state.reset_open.clone() }}"
          title="Reset the counter?"
          description="This sets the count back to zero. You can keep counting after."
        >
          <p class="meta">The buttons below are the footer slot.</p>
          <template slot="footer">
            <Button variant="quiet" size="md" on_press="{{ state.cancel_reset.clone() }}">Cancel</Button>
            <Button variant="danger" size="md" on_press="{{ state.confirm_reset.clone() }}">Reset count</Button>
            <Button variant="secondary" size="md" on_press="{{ state.ask_details.clone() }}">Why?</Button>
          </template>
        </Dialog>
        <Dialog
          open="{{ state.details_open.clone() }}"
          title="Reset is local"
          description="This only clears the count in this tab. The rest of the page stays as it is."
        >
          <template slot="footer">
            <Button variant="primary" size="md" on_press="{{ state.close_details.clone() }}">OK</Button>
          </template>
        </Dialog>
      </section>
    </App>
  </body>
</html>
