[package]
name = "tesso-site"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Tesso site. A Fusor app that uses Tesso and serves the component registry."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fusor-core = { version = "0.1.7", features = ["dom"] }
fusor-components = { version = "0.1.7", features = ["browser"] }
wasm-bindgen = "=0.2.117"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Node", "Event", "EventTarget", "HtmlDialogElement", "DomTokenList", "Storage", "Location", "Navigator", "Clipboard"] }

[build-dependencies]
fusor-build = { version = "0.1.7" }

[package.metadata.fusor]
entry = "web/index.html"
assets = { "/" = "public" }
assets-build = ["node", "build-registry.mjs"]
tailwind = "web/app.css"
output = "dist"
base-path = "/"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
