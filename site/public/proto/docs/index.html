<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Proto — Docs reading chrome</title>
    <link rel="stylesheet" href="/tokens.css" />
    <style>
      /* Shared shell — real Tesso materials. Picker styles are separate and verbatim. */
      @font-face {
        font-family: InterVariable;
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/fonts/InterVariable.woff2") format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2");
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      :root {
        --duration: 150ms;
        --easing: ease-out;
        --hit-outset: 0.75rem;
        --press-scale: 0.96;
        --z-sticky: 40;
        --header-offset: 4rem;
        --spacing: 0.25rem;
      }

      html {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        font-family: InterVariable, ui-sans-serif, system-ui, sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-size: 1rem;
        line-height: 1.5;
        font-feature-settings: "cv11", "cv05";
        font-synthesis: none;
      }

      ::selection {
        background: color-mix(in oklch, var(--foreground) 15%, transparent);
      }

      a {
        color: var(--foreground);
      }

      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--foreground);
        outline-offset: 2px;
      }

      code,
      pre {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-feature-settings: normal;
      }

      code {
        font-size: 0.875rem;
      }

      pre code {
        font-size: inherit;
        line-height: inherit;
      }

      #stage {
        min-height: 100dvh;
      }

      .shell-top {
        position: sticky;
        top: 0;
        z-index: var(--z-sticky);
        display: flex;
        align-items: center;
        gap: 1.25rem;
        min-height: var(--header-offset);
        padding: 0 1.5rem;
        padding-top: env(safe-area-inset-top);
        background-color: color-mix(in oklch, var(--background) 72%, transparent);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        border-bottom: 1px solid color-mix(in oklch, var(--foreground) 12%, transparent);
      }

      .shell-mark {
        color: var(--foreground);
        font-weight: 500;
        font-size: 1rem;
        letter-spacing: -0.025em;
        text-decoration: none;
      }

      .shell-nav {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        margin-left: auto;
      }

      .shell-nav a {
        position: relative;
        color: var(--muted-foreground);
        font-size: 1rem;
        text-decoration: none;
        transition: color var(--duration) var(--easing);
      }

      .shell-nav a::before {
        content: "";
        position: absolute;
        inset: calc(var(--hit-outset) * -1);
      }

      .shell-nav a[aria-current="page"],
      .shell-nav a:hover {
        color: var(--foreground);
      }

      .theme-toggle {
        position: relative;
        isolation: isolate;
        width: 2.25rem;
        height: 1.25rem;
        margin: 0;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: calc(infinity * 1px);
        background: var(--muted);
        cursor: pointer;
        transition:
          background-color var(--duration) var(--easing),
          border-color var(--duration) var(--easing),
          transform var(--duration) var(--easing);
      }

      .theme-toggle::before {
        content: "";
        position: absolute;
        inset: calc(var(--hit-outset) * -1);
      }

      .theme-toggle:active {
        transform: scale(var(--press-scale));
      }

      .theme-knob {
        position: absolute;
        top: 0.125rem;
        left: 0.125rem;
        width: 0.875rem;
        height: 0.875rem;
        border-radius: calc(infinity * 1px);
        background: var(--foreground);
        pointer-events: none;
        transition: left var(--duration) var(--easing);
      }

      .dark .theme-knob {
        left: calc(100% - 0.875rem - 0.125rem);
      }

      .proto-note {
        margin: 0;
        padding: 0.5rem 1.5rem;
        background: var(--muted);
        color: var(--muted-foreground);
        font-size: 0.875rem;
        border-bottom: 1px solid var(--border);
      }

      .proto-note code {
        font-size: inherit;
      }

      /* —— Shared article bits —— */
      .article h1 {
        margin: 0;
        font-weight: 500;
        letter-spacing: -0.025em;
        text-wrap: balance;
      }

      .article p,
      .article ul {
        margin: 0;
        color: var(--foreground);
      }

      .article ul {
        padding-left: 1.25rem;
      }

      .article li + li {
        margin-top: 0.5rem;
      }

      .article a:not(.nav-link):not(.toc-link):not(.subnav-link) {
        color: var(--foreground);
        text-decoration: underline;
        text-decoration-thickness: from-font;
        text-underline-position: from-font;
        text-decoration-skip-ink: auto;
        text-underline-offset: 0.12em;
      }

      .article pre {
        margin: 0;
        padding: 0.75rem 1rem;
        overflow: auto;
        background: var(--muted);
        color: var(--foreground);
        border-radius: var(--radius);
        font-size: 0.875rem;
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        scrollbar-width: thin;
        scrollbar-color: color-mix(in oklch, var(--foreground) 20%, transparent) transparent;
      }

      .code-wrap {
        position: relative;
      }

      .copy-btn {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 2.5rem;
        min-height: 2.5rem;
        margin: 0;
        padding: 0;
        border: 1px solid transparent;
        border-radius: calc(var(--radius) - 0.125rem);
        background: color-mix(in oklch, var(--background) 80%, transparent);
        color: var(--muted-foreground);
        cursor: pointer;
        transition:
          color var(--duration) var(--easing),
          background-color var(--duration) var(--easing);
      }

      .copy-btn:hover {
        color: var(--foreground);
        background: var(--background);
      }

      .copy-btn:active {
        transform: scale(var(--press-scale));
      }

      .copy-btn[data-copied] {
        color: var(--foreground);
      }

      .copy-icon {
        display: block;
        width: 1rem;
        height: 1rem;
        background-color: currentColor;
        mask-repeat: no-repeat;
        mask-position: center;
        mask-size: contain;
        mask-mode: alpha;
        -webkit-mask-repeat: no-repeat;
        -webkit-mask-position: center;
        -webkit-mask-size: contain;
        mask-image: url("/icons/copied.svg");
        -webkit-mask-image: url("/icons/copied.svg");
        pointer-events: none;
      }

      .copy-btn[data-copied] .copy-icon {
        mask-image: url("/icons/check.svg");
        -webkit-mask-image: url("/icons/check.svg");
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* —— 1 Linear (baseline) —— */
      .v-linear .frame {
        width: min(100% - 3rem, 75rem);
        margin: 0 auto;
      }

      .v-linear .article {
        display: grid;
        gap: 1rem;
        max-width: 40rem;
        padding: 2rem 0 4rem;
      }

      .v-linear .article h1 {
        font-size: 2rem;
        line-height: 1.25;
      }

      .v-linear .article p,
      .v-linear .article ul {
        line-height: 1.5;
      }

      .v-linear .jump {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border);
        font-size: 0.875rem;
      }

      .v-linear .jump a {
        color: var(--muted-foreground);
        text-decoration: none;
      }

      .v-linear .jump a:hover,
      .v-linear .jump a[aria-current="page"] {
        color: var(--foreground);
      }

      /* —— 2 Rail —— */
      .v-rail .layout {
        display: grid;
        grid-template-columns: 14rem minmax(0, 1fr);
        gap: 0;
        width: min(100%, 72rem);
        margin: 0 auto;
        min-height: calc(100dvh - var(--header-offset));
      }

      .v-rail .side {
        position: sticky;
        top: var(--header-offset);
        align-self: start;
        height: calc(100dvh - var(--header-offset));
        padding: 1.5rem 1rem 2rem 1.5rem;
        overflow: auto;
        border-right: 1px solid var(--border);
      }

      .v-rail .side-label {
        margin: 0 0 0.75rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .v-rail .side-label + .side-label {
        margin-top: 1.5rem;
      }

      .v-rail .side nav {
        display: grid;
        gap: 0.125rem;
      }

      .v-rail .nav-link {
        position: relative;
        display: block;
        padding: 0.375rem 0.625rem;
        border-radius: calc(var(--radius) - 0.125rem);
        color: var(--muted-foreground);
        font-size: 0.875rem;
        line-height: 1.25;
        text-decoration: none;
        transition: color var(--duration) var(--easing), background-color var(--duration) var(--easing);
      }

      .v-rail .nav-link:hover {
        color: var(--foreground);
        background: var(--muted);
      }

      .v-rail .nav-link[aria-current="page"] {
        color: var(--foreground);
        background: var(--accent);
      }

      .v-rail .article {
        display: grid;
        gap: 1.25rem;
        max-width: 42rem;
        padding: 2rem 2rem 5rem;
      }

      .v-rail .article h1 {
        font-size: 1.875rem;
        line-height: 1.2;
      }

      .v-rail .article p,
      .v-rail .article ul {
        max-width: 65ch;
        line-height: 1.55;
      }

      .v-rail .lede {
        color: var(--muted-foreground);
        font-size: 1.0625rem;
        line-height: 1.5;
      }

      @media (max-width: 48rem) {
        .v-rail .layout {
          grid-template-columns: 1fr;
        }

        .v-rail .side {
          position: static;
          height: auto;
          border-right: 0;
          border-bottom: 1px solid var(--border);
          padding: 1rem 1.25rem;
        }

        .v-rail .side nav {
          display: flex;
          flex-wrap: wrap;
          gap: 0.25rem;
        }
      }

      /* —— 3 Editorial —— */
      .v-editorial .subnav {
        display: flex;
        gap: 0.25rem;
        padding: 0.75rem 1.5rem;
        overflow-x: auto;
        border-bottom: 1px solid var(--border);
        scrollbar-width: none;
      }

      .v-editorial .subnav::-webkit-scrollbar {
        display: none;
      }

      .v-editorial .subnav-link {
        flex: 0 0 auto;
        padding: 0.5rem 0.875rem;
        border-radius: calc(infinity * 1px);
        color: var(--muted-foreground);
        font-size: 0.875rem;
        text-decoration: none;
        white-space: nowrap;
        transition: color var(--duration) var(--easing), background-color var(--duration) var(--easing);
      }

      .v-editorial .subnav-link:hover {
        color: var(--foreground);
      }

      .v-editorial .subnav-link[aria-current="page"] {
        color: var(--foreground);
        background: var(--muted);
      }

      .v-editorial .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 12rem;
        gap: 3rem;
        width: min(100% - 3rem, 56rem);
        margin: 0 auto;
        padding: 3rem 0 6rem;
      }

      .v-editorial .article {
        display: grid;
        gap: 1.5rem;
        max-width: 38rem;
      }

      .v-editorial .kicker {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 0.8125rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .v-editorial .article h1 {
        font-size: clamp(2.25rem, 4vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.03em;
      }

      .v-editorial .lede {
        max-width: 42ch;
        color: var(--muted-foreground);
        font-size: 1.25rem;
        line-height: 1.45;
        text-wrap: pretty;
      }

      .v-editorial .article p,
      .v-editorial .article ul {
        max-width: 62ch;
        line-height: 1.6;
      }

      .v-editorial .article h2 {
        margin: 1rem 0 0;
        font-size: 1.25rem;
        font-weight: 500;
        letter-spacing: -0.025em;
        line-height: 1.25;
        text-wrap: balance;
        scroll-margin-top: calc(var(--header-offset) + 1rem);
      }

      .v-editorial .outline {
        position: sticky;
        top: calc(var(--header-offset) + 1.5rem);
        align-self: start;
        display: grid;
        gap: 0.5rem;
      }

      .v-editorial .outline-label {
        margin: 0 0 0.25rem;
        color: var(--muted-foreground);
        font-size: 0.75rem;
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .v-editorial .toc-link {
        color: var(--muted-foreground);
        font-size: 0.8125rem;
        line-height: 1.35;
        text-decoration: none;
        transition: color var(--duration) var(--easing);
      }

      .v-editorial .toc-link:hover,
      .v-editorial .toc-link[aria-current="true"] {
        color: var(--foreground);
      }

      @media (max-width: 56rem) {
        .v-editorial .layout {
          grid-template-columns: 1fr;
          gap: 2rem;
        }

        .v-editorial .outline {
          position: static;
          padding-bottom: 1rem;
          border-bottom: 1px solid var(--border);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .shell-nav a,
        .theme-toggle,
        .theme-knob,
        .copy-btn,
        .v-rail .nav-link,
        .v-editorial .subnav-link,
        .v-editorial .toc-link {
          transition-duration: 0ms;
        }

        .theme-toggle:active,
        .copy-btn:active {
          transform: none;
        }
      }

      /* —— Picker (verbatim from emil-prototype/PICKER.md) —— */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }

      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }

      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight {
          transition: none;
        }
      }

      .proto-picker-item {
        position: relative;
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: rgba(255, 255, 255, 0.55);
        font: inherit;
        cursor: pointer;
        transition: color 150ms ease-out;
      }

      .proto-picker-item:hover {
        color: rgba(255, 255, 255, 0.85);
      }

      .proto-picker-item:active {
        transform: scale(0.97);
      }

      .proto-picker-item:focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.4);
        outline-offset: 2px;
      }

      .proto-picker-item[data-active] {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <p class="proto-note">
      Throwaway prototype. Not production. Docs reading chrome · keys
      <code>1</code>–<code>3</code> / arrows ·
      <a href="/docs/add">live Add page</a>
    </p>
    <div id="stage"></div>
    <nav class="proto-picker" aria-label="Prototype variants">
      <span class="proto-picker-highlight" aria-hidden="true"></span>
      <button class="proto-picker-item" type="button" data-active aria-current="true">Linear</button>
      <button class="proto-picker-item" type="button">Rail</button>
      <button class="proto-picker-item" type="button">Editorial</button>
    </nav>
    <script>
      const NAV = [
        { href: "#install", label: "Install", group: "Guide" },
        { href: "#init", label: "Init", group: "Guide" },
        { href: "#check", label: "Check", group: "Guide" },
        { href: "#add", label: "Add", group: "Guide", current: true },
        { href: "#button", label: "Button", group: "Components" },
        { href: "#card", label: "Card", group: "Components" },
        { href: "#dialog", label: "Dialog", group: "Components" },
      ];

      const SNIPPET = `npx tesso-ui add button
npx tesso-ui add card --diff
npx tesso-ui add dialog --force
npx tesso-ui add button --registry ../registry`;

      function topBar() {
        return `
          <header class="shell-top">
            <a class="shell-mark" href="/">Tesso</a>
            <nav class="shell-nav" aria-label="Site">
              <a href="/docs/install" aria-current="page">Docs</a>
              <a href="https://github.com/jorgefyi/tesso" target="_blank" rel="noreferrer">GitHub</a>
              <button type="button" class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-knob" aria-hidden="true"></span>
              </button>
            </nav>
          </header>`;
      }

      function articleBody(opts = {}) {
        const { lede, sections } = opts;
        return `
          <article class="article">
            ${opts.kicker ? `<p class="kicker">${opts.kicker}</p>` : ""}
            <h1>Add</h1>
            ${lede ? `<p class="lede">${lede}</p>` : ""}
            <p>
              <code>tesso add</code> reads one JSON file per component from a single base URL.
              The default is <code>https://tesso.fyi/r/</code>, so button is
              <a href="/r/button.json">/r/button.json</a>.
              The command prints the registry it used.
            </p>
            <p>
              <code>--registry</code> takes that base URL or a local folder. CI, tests, and offline
              use pass a checkout, for example <code>--registry ../registry</code>.
              <code>tesso.config.json</code> can set the same <code>registry</code> value. The flag wins.
            </p>
            <div class="code-wrap">
              <pre><code>${SNIPPET}</code></pre>
              <button type="button" class="copy-btn" aria-label="Copy install command">
                <span class="copy-icon" aria-hidden="true"></span>
              </button>
              <span class="sr-only" aria-live="polite"></span>
            </div>
            ${
              sections
                ? `
              <h2 id="behavior">Behavior</h2>
              <ul>
                <li>A missing file is written. An identical file is kept.</li>
                <li>A file that already exists and differs is skipped. add says so and exits 0.</li>
                <li><code>--diff</code> prints the diff and does not write. <code>--force</code> overwrites. <code>--overwrite</code> is the same flag.</li>
                <li>If this CLI is older than the file’s minimum tesso-ui version, add writes nothing and names the version it needs.</li>
                <li>If the registry cannot be reached, add fails and names the URL.</li>
              </ul>
              <h2 id="list">List</h2>
              <p>
                <code>tesso list</code> prints the same registry. Components require an empty prefix,
                because they read variables such as <code>--primary</code>.
              </p>
              <h2 id="ownership">Ownership</h2>
              <p>
                Files land in your project as source. Change them there. A later add will skip a file
                that already differs, so your edits stay unless you pass <code>--force</code>.
              </p>`
                : `
              <ul>
                <li>A missing file is written. An identical file is kept.</li>
                <li>A file that already exists and differs is skipped. add says so and exits 0.</li>
                <li><code>--diff</code> prints the diff and does not write. <code>--force</code> overwrites. <code>--overwrite</code> is the same flag.</li>
                <li>If this CLI is older than the file’s minimum tesso-ui version, add writes nothing and names the version it needs.</li>
                <li>If the registry cannot be reached, add fails and names the URL.</li>
              </ul>
              <p>
                <code>tesso list</code> prints the same registry. Components require an empty prefix,
                because they read variables such as <code>--primary</code>.
              </p>`
            }
          </article>`;
      }

      function wireChrome(root) {
        const toggle = root.querySelector(".theme-toggle");
        toggle?.addEventListener("click", () => {
          document.documentElement.classList.toggle("dark");
          localStorage.setItem(
            "theme",
            document.documentElement.classList.contains("dark") ? "dark" : "light",
          );
        });

        root.querySelectorAll(".copy-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const text = btn.parentElement.querySelector("pre")?.innerText ?? "";
            try {
              await navigator.clipboard.writeText(text);
            } catch (_) {}
            btn.setAttribute("data-copied", "");
            const live = btn.parentElement.querySelector("[aria-live]");
            if (live) live.textContent = "Copied";
            window.setTimeout(() => {
              btn.removeAttribute("data-copied");
              if (live) live.textContent = "";
            }, 1600);
          });
        });
      }

      function linear() {
        const jump = NAV.map(
          (n) =>
            `<a href="${n.href}"${n.current ? ' aria-current="page"' : ""}>${n.label}</a>`,
        ).join("");
        return `
          <div class="v-linear">
            ${topBar()}
            <div class="frame">
              <nav class="jump" aria-label="Docs pages">${jump}</nav>
              ${articleBody()}
            </div>
          </div>`;
      }

      function rail() {
        const guide = NAV.filter((n) => n.group === "Guide")
          .map(
            (n) =>
              `<a class="nav-link" href="${n.href}"${n.current ? ' aria-current="page"' : ""}>${n.label}</a>`,
          )
          .join("");
        const comps = NAV.filter((n) => n.group === "Components")
          .map((n) => `<a class="nav-link" href="${n.href}">${n.label}</a>`)
          .join("");
        return `
          <div class="v-rail">
            ${topBar()}
            <div class="layout">
              <aside class="side" aria-label="Docs">
                <p class="side-label">Guide</p>
                <nav>${guide}</nav>
                <p class="side-label">Components</p>
                <nav>${comps}</nav>
              </aside>
              ${articleBody({
                lede: "Copy a component from the registry into your app as source you own.",
              })}
            </div>
          </div>`;
      }

      function editorial() {
        const sub = NAV.map(
          (n) =>
            `<a class="subnav-link" href="${n.href}"${n.current ? ' aria-current="page"' : ""}>${n.label}</a>`,
        ).join("");
        return `
          <div class="v-editorial">
            ${topBar()}
            <nav class="subnav" aria-label="Docs pages">${sub}</nav>
            <div class="layout">
              ${articleBody({
                kicker: "Guide",
                lede: "Copy a component from the registry into your app as source you own.",
                sections: true,
              })}
              <aside class="outline" aria-label="On this page">
                <p class="outline-label">On this page</p>
                <a class="toc-link" href="#behavior" aria-current="true">Behavior</a>
                <a class="toc-link" href="#list">List</a>
                <a class="toc-link" href="#ownership">Ownership</a>
              </aside>
            </div>
          </div>`;
      }

      const variants = [linear, rail, editorial];
      const stage = document.getElementById("stage");
      const picker = document.querySelector(".proto-picker");
      const highlight = picker.querySelector(".proto-picker-highlight");
      const items = [...picker.querySelectorAll(".proto-picker-item")];
      let current = 0;

      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
        }
      } catch (_) {}

      function moveHighlight() {
        const el = items[current];
        highlight.style.width = el.offsetWidth + "px";
        highlight.style.transform = `translateX(${el.offsetLeft}px)`;
      }

      function mount(i) {
        stage.innerHTML = "";
        requestAnimationFrame(() => {
          stage.innerHTML = variants[i]();
          wireChrome(stage);
        });
      }

      function setActive(i) {
        if (i < 0 || i >= variants.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute("data-active", j === i);
          if (j === i) el.setAttribute("aria-current", "true");
          else el.removeAttribute("aria-current");
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set("v", String(i + 1));
        history.replaceState(null, "", url);
        mount(i);
      }

      items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
      window.addEventListener("resize", moveHighlight);

      document.addEventListener("keydown", (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === "ArrowRight") setActive((current + 1) % variants.length);
        else if (e.key === "ArrowLeft") setActive((current - 1 + variants.length) % variants.length);
      });

      setActive((parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1);
      requestAnimationFrame(() =>
        requestAnimationFrame(() => picker.setAttribute("data-ready", "")),
      );
    </script>
  </body>
</html>
